<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="抽象界面：深色底上的极光与栅格">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c13" />
      <stop offset="0.55" stop-color="#080910" />
      <stop offset="1" stop-color="#05060a" />
    </linearGradient>

    <radialGradient id="aurora" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8d6cff" stop-opacity="0.92" />
      <stop offset="0.38" stop-color="#5a63e8" stop-opacity="0.46" />
      <stop offset="0.72" stop-color="#2f4bb0" stop-opacity="0.14" />
      <stop offset="1" stop-color="#101528" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.4" stop-color="#c9b8ff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#8d6cff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6cff" stop-opacity="0" />
      <stop offset="0.3" stop-color="#8d6cff" stop-opacity="0.55" />
      <stop offset="0.7" stop-color="#6ea8ff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a" stop-opacity="0" />
      <stop offset="1" stop-color="#05060a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)" />
  <rect width="1600" height="1000" fill="url(#grid)" />

  <ellipse cx="800" cy="470" rx="620" ry="310" fill="url(#aurora)" filter="url(#soft)" />
  <ellipse cx="800" cy="470" rx="360" ry="180" fill="url(#aurora)" opacity="0.7" />

  <line x1="0" y1="660" x2="1600" y2="660" stroke="url(#horizon)" stroke-width="1.5" />
  <ellipse cx="800" cy="660" rx="420" ry="26" fill="#8d6cff" opacity="0.16" filter="url(#soft)" />

  <circle cx="800" cy="470" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.14" />
  <circle cx="800" cy="470" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.07" />
  <circle cx="800" cy="470" r="7" fill="url(#core)" />
  <circle cx="800" cy="470" r="3" fill="#ffffff" />

  <g stroke="#ffffff" stroke-opacity="0.2">
    <line x1="800" y1="286" x2="800" y2="316" />
    <line x1="800" y1="624" x2="800" y2="654" />
    <line x1="616" y1="470" x2="646" y2="470" />
    <line x1="954" y1="470" x2="984" y2="470" />
  </g>

  <rect y="700" width="1600" height="300" fill="url(#floor)" />
  <rect width="1600" height="1000" fill="url(#vignette)" />
</svg>
